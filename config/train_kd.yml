DATASET:
    train_list: ['PW3D']
    test_list: ['PW3D']
    input_joint_set: 'coco'
    target_joint_set: 'human36' 
    workers: 8
    use_gt_input: False  # Student dùng Pose2D dự đoán (không dùng GT) để sát thực tế
    seqlen: 16
    stride: 1

MODEL:
    name: 'Student'
    hpe_dim: 512
    hpe_dep: 3
    joint_dim: 64
    vertx_dim: 64
    joint_loss_weight: 0.01
    shape_loss_weight: 0.06
    pose_loss_weight: 0.06
    posenet_pretrained: True # Bật pretrained cho Student Lifter
    posenet_path: './experiment/ARTS_PoseEstimation/checkpoint/best.pth.tar'   # 16frame
    teacher_path: './experiment/exp_07-18_12_37/checkpoint/best.pth.tar' # Trỏ tới model Teacher vừa train xong

TRAIN:
    print_freq: 20
    batch_size: 16
    shuffle: True
    begin_epoch: 1
    end_epoch: 30
    edge_loss_start: 2
    scheduler: 'step'
    lr: 0.0005
    lr_step: [10, 20]
    lr_factor: 0.5
    optimizer: 'adam'
    wandb: False 
    relation_weight: 1.0 # Trọng số Relation KD loss (pairwise similarity)
    # Alpha được tự học qua uncertainty weighting (log_sigma) — không cần config

TEST:
    batch_size: 64
    shuffle: False
