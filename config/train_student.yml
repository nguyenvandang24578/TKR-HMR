DATASET:
    train_list: ['PW3D']
    test_list: ['PW3D']
    input_joint_set: 'coco'
    target_joint_set: 'human36' 
    workers: 8
    use_gt_input: False  # Student dùng Pose2D dự đoán (không dùng GT) để sát thực tế
    seqlen: 16
    stride: 1

MODEL:
    name: 'Student'
    hpe_dim: 256
    hpe_dep: 3
    joint_dim: 64
    vertx_dim: 64
    normal_loss_weight: 0.1
    edge_loss_weight: 20
    joint_loss_weight: 0.001
    shape_loss_weight: 0.06
    pose_loss_weight: 0.06
    posenet_pretrained: True  # Bật pretrained cho PoseLifter của Student
    posenet_path: './experiment/ARTS_PoseEstimation/checkpoint/best.pth.tar'   # 16frame

TRAIN:
    print_freq: 20
    batch_size: 16
    shuffle: True
    begin_epoch: 1
    end_epoch: 50
    edge_loss_start: 2
    scheduler: 'cosine'
    lr: 0.00005
    lr_step: [20, 35, 45]
    lr_factor: 0.5
    optimizer: 'adam'
    wandb: False

TEST:
    batch_size: 64
    shuffle: False
